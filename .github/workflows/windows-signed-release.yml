name: Windows signed release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-signed-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify:deploy
  windows:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: windows-release
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Require code signing certificate
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) { throw "Windows signing credentials are missing" }
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build signed Windows installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run dist:win
      - name: Prepare signed download and integrity metadata
        run: node release-metadata.cjs Windows signed-release
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folklard-windows-signed
          path: |
            desktop/dist/Folklard-Windows.exe
            desktop/dist/Folklard-Windows.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: folklard-windows-signed
          path: signed-windows
      - name: Publish signed Windows download
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: downloads-desktop
          name: Folklard - PC
          prerelease: true
          make_latest: false
          body: |
            Windows assinado do commit ${{ github.sha }}. O asset Linux permanece no mesmo canal de downloads.
            Versão, tamanho, commit e SHA-256 em Folklard-Windows.json.
          files: signed-windows/*
          fail_on_unmatched_files: true
          overwrite_files: true
