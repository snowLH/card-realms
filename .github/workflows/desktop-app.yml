name: Desktop installers
on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-app.yml"
permissions:
  contents: read
concurrency:
  group: desktop-downloads
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run verify:deploy
  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            target: dist:win
          - os: ubuntu-latest
            platform: Linux
            target: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Build dedicated installer
        run: npm run ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Prepare direct download and integrity metadata
        run: node release-metadata.cjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: folklard-${{ matrix.platform }}-download
          path: |
            desktop/dist/Folklard-${{ matrix.platform }}.exe
            desktop/dist/Folklard-${{ matrix.platform }}.AppImage
            desktop/dist/Folklard-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: folklard-*-download
          merge-multiple: true
          path: installers
      - name: Require both installers before publishing
        run: |
          test -s installers/Folklard-Windows.exe
          test -s installers/Folklard-Linux.AppImage
          test -s installers/Folklard-Windows.json
          test -s installers/Folklard-Linux.json
      - name: Publish verified test builds
        uses: softprops/action-gh-release@v2
        with:
          tag_name: downloads-desktop
          name: Folklard - PC (versões de teste)
          prerelease: true
          make_latest: false
          body: |
            Aplicativos de teste para Windows x64 e Linux x86_64.
            Build do commit ${{ github.sha }}. Versão, tamanho e SHA-256 em cada arquivo JSON.
            Conexão com a internet necessária. Instaladores sem certificado de distribuição.
          files: installers/*
          fail_on_unmatched_files: true
          overwrite_files: true
