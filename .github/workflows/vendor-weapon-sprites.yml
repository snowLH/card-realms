name: Vendor CC0 weapon sprites
on:
  push:
    branches:
      - feat/external-weapon-sprites-cc0
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vendor-cc0-weapon-art
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/external-weapon-sprites-cc0'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/external-weapon-sprites-cc0
      - name: Download and validate original CC0 PNG
        run: python3 scripts/vendor-weapon-sprites.py
      - name: Commit original PNG to implementation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/art/vendor/opengameart/bennyboi-hack/weaponpack.png
          if ! git diff --cached --quiet; then
            git commit -m "chore(art): vendor original Bennyboi_hack CC0 weapon sprites"
            for attempt in 1 2 3 4 5; do
              git fetch origin feat/external-weapon-sprites-cc0
              git rebase origin/feat/external-weapon-sprites-cc0
              if git push origin HEAD:feat/external-weapon-sprites-cc0; then
                exit 0
              fi
              sleep 3
            done
            echo "Failed to push vendored PNG after five attempts" >&2
            exit 1
          fi
