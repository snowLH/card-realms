name: iOS simulator app
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - "src/server/downloads/**"
      - "src/app/instalar/**"
      - ".github/workflows/ios-simulator.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "src/server/downloads/**"
      - "src/app/instalar/**"
      - ".github/workflows/ios-simulator.yml"
permissions:
  contents: read
concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:deploy
  ios:
    needs: verify
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked Capacitor dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate branded iOS project with Swift Package Manager
        run: |
          npm run ios:init
          node prepare-native.cjs ios
          npx cap sync ios
      - name: Compile for iPhone simulator without signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath build build
      - name: Upload simulator application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: folklard-ios-simulator
          path: mobile/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
