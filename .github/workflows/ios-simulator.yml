name: iOS simulator app
on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/ios-simulator.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run verify:deploy
  ios:
    needs: verify
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked Capacitor dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate branded iOS project with Swift Package Manager
        run: |
          npm run ios:init
          node prepare-native.cjs ios
          npx cap sync ios
      - name: Compile for iPhone simulator without signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath build build
      - name: Upload simulator application
        uses: actions/upload-artifact@v4
        with:
          name: folklard-ios-simulator
          path: mobile/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
