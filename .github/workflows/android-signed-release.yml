name: Android signed release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-signed-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify:deploy
  release:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-release
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Require release signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Android release signing secrets not configured'; exit 1; }
      - name: Install Capacitor
        run: npm ci --no-audit --no-fund
      - name: Generate Android project
        run: |
          npx cap add android
          node prepare-native.cjs android
          npx cap sync android
      - name: Decode keystore securely
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
      - name: Configure Gradle signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> android/app/build.gradle <<'GRADLE'
          android {
            signingConfigs {
              release {
                storeFile file("../release.keystore")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
              }
            }
            buildTypes { release { signingConfig signingConfigs.release } }
          }
          GRADLE
      - name: Build signed release APK
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease
      - name: Prepare signed download and integrity metadata
        run: node release-metadata.cjs release signed-release
      - name: Upload signed release
        uses: actions/upload-artifact@v7
        with:
          name: folklard-android-signed
          path: |
            mobile/android/app/build/outputs/apk/release/Folklard-Android.apk
            mobile/android/app/build/outputs/apk/release/Folklard-Android.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f android/release.keystore

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: folklard-android-signed
          path: signed-apk
      - name: Publish signed Android download
        uses: softprops/action-gh-release@v3
        with:
          tag_name: downloads-android
          name: Folklard - Android
          prerelease: true
          make_latest: false
          body: |
            APK Android assinado do commit ${{ github.sha }}.
            Android 7+, WebView 111+ e internet necessários.
            Versão, tamanho, commit e SHA-256 em Folklard-Android.json.
          files: signed-apk/*
          fail_on_unmatched_files: true
          overwrite_files: true
