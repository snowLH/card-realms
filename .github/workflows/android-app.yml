name: Android test APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-app.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android-app.yml"
permissions:
  contents: read
concurrency:
  group: android-downloads-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify:deploy
  android:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      update-compatible: ${{ steps.signing.outputs.compatible }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked Capacitor dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate branded native Android project
        run: |
          npx cap add android
          node prepare-native.cjs android
          npx cap sync android
      - name: Build debug APK
        run: bash ./gradlew assembleDebug
        working-directory: mobile/android
      - name: Prepare downloadable APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Folklard-Android.apk
          node release-metadata.cjs
      - name: Check update signature against the currently distributed APK
        id: signing
        run: |
          compatible=false
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$signer"
          if curl --fail --location --silent --show-error 'https://github.com/snowLH/card-realms/releases/download/downloads-android/Folklard-Android.apk' -o previous.apk; then
            previous="$($signer verify --print-certs previous.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            current="$($signer verify --print-certs android/app/build/outputs/apk/debug/Folklard-Android.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            if [ -n "$previous" ] && [ "$previous" = "$current" ]; then compatible=true; fi
          fi
          echo "compatible=$compatible" >> "$GITHUB_OUTPUT"
          if [ "$compatible" != true ]; then
            echo '### APK compiled; official download preserved' >> "$GITHUB_STEP_SUMMARY"
            echo 'The signing certificate differs or could not be verified. The new APK is available as a test artifact only. It will not overwrite the official download because installed copies cannot update with a different key.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: folklard-android-debug
          path: |
            mobile/android/app/build/outputs/apk/debug/Folklard-Android.apk
            mobile/android/app/build/outputs/apk/debug/Folklard-Android.json
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: android
    if: github.ref == 'refs/heads/main' && needs.android.outputs.update-compatible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: folklard-android-debug
          path: apk
      - name: Publish compatible test APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: downloads-android
          name: Folklard - Android (versão de teste)
          prerelease: true
          make_latest: false
          body: |
            APK de teste do commit ${{ github.sha }}. Android 7+, WebView 111+ e internet necessários.
            Versão e SHA-256 em Folklard-Android.json. Assinatura de desenvolvimento.
          files: apk/*
          fail_on_unmatched_files: true
          overwrite_files: true
