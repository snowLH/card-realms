name: Android test APK
on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-app.yml"
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Generate native Android project
        run: npx cap add android
      - name: Build debug APK
        run: bash ./gradlew assembleDebug
        working-directory: mobile/android
      - name: Name downloadable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Folklard-Android.apk
      - name: Publish direct-download APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: downloads-android
          name: Folklard - Android (versão de teste)
          prerelease: true
          make_latest: false
          files: mobile/android/app/build/outputs/apk/debug/Folklard-Android.apk
          overwrite_files: true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: folklard-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
